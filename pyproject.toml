[project]
name = "sw-optimizer"
version = "0.1.0"
description = "Optimizador de Runas y Builds para Summoners War (SW-Optimizer)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "pydantic>=2.14.2",
    "streamlit>=1.66.1",
]

[project.scripts]
sw-optimizer = "sw_optimizer:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

